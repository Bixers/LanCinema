name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      focused:
        description: 'Run display-mode UI checks and all unit/audio tests'
        type: boolean
        default: false
      unit_only:
        description: 'Run all unit/audio tests in a fresh simulator without UI-runner handoff'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen
          if ! command -v pod >/dev/null; then gem install cocoapods --no-document; fi
          xcodebuild -version
      - name: Generate project and install VLC
        run: |
          xcodegen generate
          pod install
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -workspace LanCinema.xcworkspace -scheme LanCinema \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tee build.log
      - name: Package and verify IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LanCinema.app package/Payload/
          test -x package/Payload/LanCinema.app/LanCinema
          file package/Payload/LanCinema.app/LanCinema | grep arm64
          plutil -lint package/Payload/LanCinema.app/Info.plist
          cd package
          zip -qry ../LanCinema-unsigned.ipa Payload
          cd ..
          shasum -a 256 LanCinema-unsigned.ipa > SHA256.txt
          unzip -t LanCinema-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LanCinema-unsigned
          path: |
            LanCinema-unsigned.ipa
            SHA256.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
  ui-tests:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen
          if ! command -v pod >/dev/null; then gem install cocoapods --no-document; fi
          xcodegen generate
          pod install
      - name: Run server checks
        run: |
          python3 -m pip install --break-system-packages imageio-ffmpeg
          cd server && python3 -m unittest -v test_server.py test_video_probe.py test_playback_cache.py
      - name: Boot simulator
        timeout-minutes: 6
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], timeout=30))
          pairs = [(k, x) for k, xs in devices['devices'].items() for x in xs if x['name'] == 'iPhone 17 Pro']
          pairs.sort(key=lambda p: tuple(int(n) for n in p[0].split('iOS-')[-1].split('-')), reverse=True)
          device = pairs[0][1]['udid']
          print('Selected runtime:', pairs[0][0], flush=True)
          subprocess.run(['xcrun', 'simctl', 'boot', device], check=True, timeout=45)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=240)
          # Cosmetic appearance commands must not prevent the actual tests.
          try:
              subprocess.run(['xcrun', 'simctl', 'ui', device, 'appearance', 'light'], check=True, timeout=20)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              print('Appearance setup unavailable; continuing with tests', flush=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LC_SIMULATOR_ID=' + device + '\n')
          PY
      - name: Test native UI in simulator
        timeout-minutes: 23
        run: |
          python3 server/ui_fixture_server.py > /tmp/lancinema-fixture.log 2>&1 &
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          query = urllib.parse.urlencode({'token': 'ui-test-access-code', 'path': '演示文件夹/时间戳偏移测试.ts'})
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8123/api/playback?' + query, timeout=5) as response:
                      state = json.load(response)
                  if state['state'] == 'ready':
                      print('Indexed synthetic TS fixture is ready', flush=True)
                      break
                  if state['state'] == 'error':
                      raise RuntimeError(state)
              except OSError:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError('Fixture preparation timed out')
          PY
          set -o pipefail
          TEST_SELECTION=()
          if [ '${{ inputs.unit_only }}' = 'true' ]; then
            TEST_SELECTION=('-only-testing:LanCinemaTests')
          elif [ '${{ inputs.focused }}' = 'true' ]; then
            TEST_SELECTION=(
              '-only-testing:LanCinemaUITests/PlaybackTests/testAutomaticFillAndSavedDisplayMode'
              '-only-testing:LanCinemaUITests/PlaybackTests/testSmartCropKeepsSubtitlesVisible'
              '-only-testing:LanCinemaTests'
            )
          fi
          xcodebuild -workspace LanCinema.xcworkspace -scheme LanCinema "${TEST_SELECTION[@]}" \
            -configuration Debug -destination "platform=iOS Simulator,id=$LC_SIMULATOR_ID" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO -resultBundlePath UITestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test | tee ui-test.log
      - name: Capture alternate appearances
        timeout-minutes: 2
        continue-on-error: true
        run: |
          DEVICE="$LC_SIMULATOR_ID"
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl terminate "$DEVICE" local.bixer.LanCinema || true
          xcrun simctl launch "$DEVICE" local.bixer.LanCinema --ui-test
          sleep 3
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/library-dark.png
          xcrun simctl ui "$DEVICE" content_size accessibility-extra-extra-extra-large
          xcrun simctl io "$DEVICE" screenshot screenshots/library-large-text.png
      - name: Export native captures
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d UITestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-validation
          path: |
            screenshots/*.png
            screenshots/*.txt
            screenshots/manifest.json
            ui-test.log
