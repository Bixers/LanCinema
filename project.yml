name: LanCinema
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
    ENABLE_BITCODE: NO
targets:
  LanCinema:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bixer.LanCinema
        PRODUCT_NAME: LanCinema
        TARGETED_DEVICE_FAMILY: '1'
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tests/Simulator.entitlements
    scheme:
      gatherCoverageData: false
      testTargets:
        - LanCinemaUITests
        - LanCinemaTests
  LanCinemaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Fixtures]
    dependencies:
      - target: LanCinema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bixer.LanCinema.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LanCinema
  LanCinemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LanCinema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bixer.LanCinema.Tests
        GENERATE_INFOPLIST_FILE: YES
